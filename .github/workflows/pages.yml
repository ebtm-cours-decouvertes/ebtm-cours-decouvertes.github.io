# Publie le seul dossier app/ sur GitHub Pages, à chaque envoi sur main.
# Rien d'autre du dépôt n'est mis en ligne : ni le PDF source, ni les scripts, ni docs/.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de republier à la main depuis l’onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Ce fichier vit dans deux dépôts : le dépôt public, d'où le site est servi, et le dépôt de
# travail privé, qui n'est pas un site. Dans le dépôt de travail, seuls les contrôles tournent :
# y déposer et y publier un paquet échouait à chaque sauvegarde. La condition désigne le dépôt
# à écarter, et non le dépôt à servir : si elle se trompait de nom, le dépôt de travail
# recommencerait à échouer, ce qui se voit, mais le site continuerait d'être publié.
# Le nom du dépôt de travail est écrit trois fois plus bas, à l'identique.

# Une seule mise en ligne à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Premier temps : les contrôles, puis le dépôt du paquet du site.
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Rien ne part en ligne si le contenu, les versets ou les contrastes ne passent pas.
      - run: node scripts/verifier-contenu.mjs
      - run: node scripts/verifier-versets.mjs
      - run: node scripts/verifier-contrastes.mjs
      # Le paquet est déposé ici, et non dans le travail qui le publie. Quand les deux étapes se
      # suivaient dans le même travail, la publication cherchait le paquet une demi-seconde après
      # son dépôt, et GitHub répondait parfois qu'il n'en voyait aucun (« No artifacts named
      # "github-pages" were found » : trois échecs le 21 novembre 2026, un le 16). Défaut connu
      # de l'outil : https://github.com/actions/deploy-pages/issues/451. Avec deux travaux,
      # plusieurs secondes les séparent. C'est la disposition des modèles de GitHub.
      - uses: actions/configure-pages@v6
        if: github.repository != 'ebtm-cours-decouvertes/cours-decouvertes-travail'
      - uses: actions/upload-pages-artifact@v5
        if: github.repository != 'ebtm-cours-decouvertes/cours-decouvertes-travail'
        with:
          path: app

  # Second temps : la publication du paquet, et rien d'autre.
  publier:
    needs: verifier
    if: github.repository != 'ebtm-cours-decouvertes/cours-decouvertes-travail'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
